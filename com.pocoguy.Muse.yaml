app-id: com.pocoguy.Muse
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.rust-stable
command: muse
build-options:
  append-path: /usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin
  env:
    NODEJS_DIR: /usr/lib/sdk/node24
    FLATPAK_ENABLE_SDK_EXT: node24,rust-stable
    CARGO_HOME: /run/build/muse/cargo
  build-args:
    - --share=network
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --persist=.
  - --device=dri
  - --socket=session-bus
  - --filesystem=xdg-music
  - --filesystem=xdg-run/app/com.discordapp.Discord
  - --filesystem=xdg-run/discord-ipc-0
modules:
  - name: nodejs-runtime
    buildsystem: simple
    build-options:
      no-debuginfo: true
    build-commands:
      - install -Dm755 /usr/lib/sdk/node24/bin/node ${FLATPAK_DEST}/bin/node
      - cp -ra /usr/lib/sdk/node24/lib ${FLATPAK_DEST}/ || true
    sources: []

  - name: rustypipe-botguard
    buildsystem: simple
    build-options:
      no-debuginfo: true
    build-commands:
      # Prefer a vendored tarball supplied as a local `type: file` source
      # (see `sources` below). Codeberg's edge bot-mitigation systematically
      # 503s automated clients (curl/wget/flatpak-builder's downloader) even
      # while a browser downloads fine, so curl --retry can't win, every
      # attempt is classified the same and shed. The vendored copy makes the
      # build independent of Codeberg. 
      - |
        set -eu
        case "$(uname -m)" in
          x86_64)  triple=x86_64-unknown-linux-gnu;  sha=4f2ec561e8f9fadece7deadc6ce0624fbdedd852222c3eb194c22153b1323129 ;;
          aarch64) triple=aarch64-unknown-linux-gnu; sha=4d038857374a69aea9be8ded981d93a776dc88d4e254f5c6d292746099abf69a ;;
          *) echo "rustypipe-botguard: unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        tarball="rustypipe-botguard-v0.1.2-${triple}.tar.xz"
        if [ -f "$tarball" ]; then
          cp "$tarball" bg.tar.xz
        else
          url="https://codeberg.org/ThetaDev/rustypipe-botguard/releases/download/v0.1.2/${tarball}"
          if command -v curl >/dev/null 2>&1; then
            curl -fL --retry 6 --retry-delay 5 --connect-timeout 30 -o bg.tar.xz "$url"
          else
            wget -t 6 --waitretry=5 --retry-on-http-error=429,500,502,503,504 -O bg.tar.xz "$url"
          fi
        fi
        echo "${sha}  bg.tar.xz" | sha256sum -c -
        tar -xf bg.tar.xz
        install -Dm755 rustypipe-botguard ${FLATPAK_DEST}/bin/rustypipe-botguard
    sources:
      # Vendored release binaries, extracted into the build dir as
      # rustypipe-botguard-v0.1.2-<triple>.tar.xz so the build-command above
      # uses them instead of hitting Codeberg. One entry per arch we build:
      # only-arches picks exactly one, so the other tarball is never staged.
      - type: file
        only-arches:
          - x86_64
        path: vendor/rustypipe-botguard/rustypipe-botguard-v0.1.2-x86_64-unknown-linux-gnu.tar.xz
        sha256: 4f2ec561e8f9fadece7deadc6ce0624fbdedd852222c3eb194c22153b1323129
      - type: file
        only-arches:
          - aarch64
        path: vendor/rustypipe-botguard/rustypipe-botguard-v0.1.2-aarch64-unknown-linux-gnu.tar.xz
        sha256: 4d038857374a69aea9be8ded981d93a776dc88d4e254f5c6d292746099abf69a

  # yt-dlp is the fallback resolver and the downloader. The app itself is
  # native, so these are the only Python packages left.
  - name: yt-dlp
    buildsystem: simple
    build-options:
      no-debuginfo: true
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-cache-dir --upgrade "yt-dlp[default]"
      - pip3 install --prefix=${FLATPAK_DEST} --no-cache-dir "yt-dlp-ejs"
    sources: []

  - name: muse
    buildsystem: simple
    build-commands:
      # The stylesheet and the icons are compiled into the binary by build.rs,
      # so the binary is the whole app. Crates come over the network, which
      # build-args already allows for this manifest.
      - cargo build --release --locked
      - install -Dm755 target/release/mixtapes ${FLATPAK_DEST}/bin/mixtapes
      - ln -s mixtapes ${FLATPAK_DEST}/bin/muse
      - install -Dm644 com.pocoguy.Muse.desktop ${FLATPAK_DEST}/share/applications/com.pocoguy.Muse.desktop
      - install -Dm644 com.pocoguy.Muse.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.pocoguy.Muse.metainfo.xml
      - install -Dm644 assets/icons/hicolor/scalable/apps/com.pocoguy.Muse.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/com.pocoguy.Muse.svg
      - install -Dm644 assets/icons/hicolor/symbolic/apps/com.pocoguy.Muse-symbolic.svg ${FLATPAK_DEST}/share/icons/hicolor/symbolic/apps/com.pocoguy.Muse-symbolic.svg
    sources:
      # The checked-out tree, so CI builds the commit it was invoked on.
      - type: dir
        path: .
        # Build output has no business inside the sandbox: a developer's
        # target directory alone is several gigabytes.
        skip:
          - .venv
          - .git
          - .ccache
          - build-dir
          - .flatpak-builder
          - target
          - target-prof
          - fixtures
          - data
