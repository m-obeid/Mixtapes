name: Build Windows

# Builds the Rust app against MSYS2's GTK 4, libadwaita and GStreamer, then
# runs the test suite. The Windows-only code (named-pipe Discord, the bundled
# botguard program, the sign-in placeholder) is compiled nowhere else, so this
# job is its only check until someone runs the build on a Windows machine.
# windows/bundle.sh then collects the DLLs, plugins and helper programs into
# a portable folder, and Inno Setup wraps that into an installer.

on:
  # A branch with an open pull request is built through the pull_request
  # event. Listening to its pushes as well ran the same commit twice.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # release.yml runs this too, to attach what it builds to the release.
  workflow_call:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Toolchain versions
        run: |
          rustc -vV
          pkg-config --modversion gtk4 libadwaita-1 gstreamer-1.0

      - name: Build
        run: cargo build --locked --release

      - name: Test
        # Network tests are #[ignore]d, as on Linux.
        run: cargo test --locked --release

      - name: Bundle
        # Installed after the tests, which skip their ffmpeg cases when it is missing.
        run: |
          pacman -S --noconfirm --needed \
            mingw-w64-ucrt-x86_64-ntldd \
            mingw-w64-ucrt-x86_64-nodejs \
            mingw-w64-ucrt-x86_64-ffmpeg \
            mingw-w64-ucrt-x86_64-glib-networking \
            mingw-w64-ucrt-x86_64-gst-plugins-ugly \
            unzip
          bash windows/bundle.sh

      - name: Build installer
        shell: pwsh
        run: |
          # Microsoft's WebView2 bootstrapper, run by the installer only where the runtime is missing.
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile windows/MicrosoftEdgeWebview2Setup.exe
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /DSourcePath="$((Resolve-Path 'dist/mixtapes').Path)" windows/installer.iss
          Get-ChildItem windows/Output/MixtapesSetup.exe

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: mixtapes-windows-x86_64-portable
          path: dist/mixtapes/
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: mixtapes-windows-x86_64-setup
          path: windows/Output/MixtapesSetup.exe
          if-no-files-found: error
